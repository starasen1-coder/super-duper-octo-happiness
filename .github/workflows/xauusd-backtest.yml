name: XAUUSD Liquidity Structure Backtest
on:
  push:
    branches: [agent-reach-setup]
    paths: [research/**, tests/**, .github/workflows/xauusd-backtest.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pandas pytest
      - run: pytest -q tests/test_backtest.py
      - run: python research/backtest_xauusd_liquidity.py --data /tmp/XAUUSD_5m.csv --out results
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-liquidity-backtest
          path: results/

# CI mirror uses completed H1 bars only; no live execution.
