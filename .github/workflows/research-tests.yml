name: Research tests
on:
  push:
    branches: [trader-skill-pipeline]
  pull_request:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-trader.txt
      - run: python -m pytest -q
