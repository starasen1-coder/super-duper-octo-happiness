name: ML research tests
on:
  push:
    branches: [feature/xauusd-liquidity-retest-v1]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install "numpy>=1.26,<3" "pandas>=2.2,<3"
      - run: python -m unittest discover -s tests -v
