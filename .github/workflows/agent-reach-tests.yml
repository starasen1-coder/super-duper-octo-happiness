name: Agent Reach research tests

on:
  push:
    branches: [agent-reach-setup]
    paths:
      - "agent-reach/**"
      - ".github/workflows/agent-reach-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent-reach/requirements-test.txt
      - name: Install test dependency
        run: python -m pip install -r agent-reach/requirements-api.txt -r agent-reach/requirements-test.txt
      - name: Run research tests
        env:
          PYTHONPATH: agent-reach
        run: python -m pytest agent-reach/tests -q
