name: Agent Reach research tests

on:
  push:
    branches: [agent-reach-setup]
    paths:
      - "agent-reach/**"
      - "security/skillspector/**"
      - "security/tool-versions.json"
      - "visual-reports/**"
      - "deploy/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/agent-reach-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent-reach/requirements-test.txt
      - name: Install test dependency
        run: python -m pip install -r agent-reach/requirements-api.txt -r agent-reach/requirements-test.txt
      - name: Run research tests
        env:
          PYTHONPATH: agent-reach
        run: python -m pytest agent-reach/tests -q

      - name: Validate Docker Compose configuration
        env:
          AGENT_REACH_API_TOKEN: ci-only-placeholder
          AGENT_REACH_DATA_DIR: /tmp/research-data
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build read-only API image
        run: docker build -f deploy/Dockerfile -t agent-reach-research-api:ci .
      - name: Run API container against read-only SQLite database
        env:
          AGENT_REACH_API_TOKEN: ci-only-placeholder
          AGENT_REACH_API_GID: "10001"
          AGENT_REACH_DATA_DIR: /tmp/research-data
        run: |
          set -euo pipefail
          mkdir -p /tmp/research-data
          PYTHONPATH=agent-reach python - <<'PY'
          from agent_reach.storage.repository import ResearchRepository
          ResearchRepository("/tmp/research-data/research.sqlite3")
          PY
          sudo chgrp 10001 /tmp/research-data /tmp/research-data/research.sqlite3
          chmod 750 /tmp/research-data
          chmod 640 /tmp/research-data/research.sqlite3
          docker compose -f deploy/docker-compose.yml up -d --build
          cleanup() { docker compose -f deploy/docker-compose.yml down --volumes; }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health >/tmp/research-health.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          data = json.load(open("/tmp/research-health.json", encoding="utf-8"))
          assert data["ok"] is True and data["database"] == "available"
          PY
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ci-only-placeholder" \
            http://127.0.0.1:8080/v1/items
      - name: Test SkillSpector policy
        env:
          PYTHONPATH: .
        run: python -m pytest security/skillspector/tests -q
      - name: Download and verify pinned SkillSpector
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/NVIDIA/SkillSpector/releases/download/v2.13.6/skillspector-2.13.6-py3-none-any.whl \
            --output /tmp/skillspector-2.13.6-py3-none-any.whl
          echo "e7b46c55e726405b2a068d375d1ee8e799e15d86f3fc05f84feb5ba962198b15  /tmp/skillspector-2.13.6-py3-none-any.whl" | sha256sum --check -
      - name: Install pinned SkillSpector
        run: python -m pip install /tmp/skillspector-2.13.6-py3-none-any.whl
      - name: Run static scan against benign fixture
        env:
          PYTHONPATH: .
        run: |
          python security/skillspector/scan.py \
            --target security/skillspector/fixtures/benign-skill \
            --revision "$GITHUB_SHA" \
            --scanner-version 2.13.6 \
            --output-dir /tmp/skillspector-report
      - name: Test optional LEMO handoff manifest
        env:
          PYTHONPATH: visual-reports
        run: python -m pytest visual-reports/lemo_opuscar/tests -q
      - name: Verify SQLite backup script
        run: |
          python - <<'PY'
          import sqlite3
          db = "/tmp/research-backup-source.sqlite3"
          with sqlite3.connect(db) as connection:
              connection.execute("CREATE TABLE sample (value TEXT)")
              connection.execute("INSERT INTO sample VALUES ('backup-ok')")
          PY
          AGENT_REACH_DB=/tmp/research-backup-source.sqlite3 \
            AGENT_REACH_BACKUP_DIR=/tmp/research-backups \
            bash deploy/backup-research-db.sh
          python - <<'PY'
          import glob
          import sqlite3
          path = glob.glob("/tmp/research-backups/*.sqlite3")[0]
          with sqlite3.connect(path) as connection:
              assert connection.execute("SELECT value FROM sample").fetchone()[0] == "backup-ok"
          PY
      - name: Install and smoke-test pinned Agent Reach
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Panniantong/Agent-Reach/releases/download/v1.6.1/agent_reach-1.6.1-py3-none-any.whl \
            --output /tmp/agent_reach-1.6.1-py3-none-any.whl
          echo "6a1085cae53118c5f1271ab24041e55ec17c509932612b919208f04d10183acb  /tmp/agent_reach-1.6.1-py3-none-any.whl" | sha256sum --check -
          python -m venv /tmp/agent-reach-venv
          /tmp/agent-reach-venv/bin/python -m pip install /tmp/agent_reach-1.6.1-py3-none-any.whl
          /tmp/agent-reach-venv/bin/agent-reach version
          /tmp/agent-reach-venv/bin/agent-reach channels > /tmp/agent-reach-channels.json
          /tmp/agent-reach-venv/bin/python - <<'PY'
          import json
          payload = json.load(open("/tmp/agent-reach-channels.json", encoding="utf-8"))
          assert payload.get("ok") is True
          assert any(channel.get("name") == "github" for channel in payload.get("channels", []))
          PY
