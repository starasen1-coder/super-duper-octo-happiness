name: SkillSpector security gate

on:
  push:
    branches: [agent-reach-setup]
    paths:
      - "security/skillspector/**"
      - "security/tool-versions.json"
      - ".github/workflows/skillspector-scan.yml"
  pull_request:
    branches: [agent-reach-setup]
    paths:
      - "security/skillspector/**"
      - "security/tool-versions.json"
      - ".github/workflows/skillspector-scan.yml"
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Public GitHub owner/repository"
        required: true
        type: string
      target_revision:
        description: "Exact 40-character commit SHA"
        required: true
        type: string
      target_subdirectory:
        description: "Skill directory inside the repository"
        required: true
        default: "."
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest==8.3.5
      - name: Test fail-closed policy
        env:
          PYTHONPATH: .
        run: python -m pytest security/skillspector/tests -q
      - name: Download and verify pinned SkillSpector wheel
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/NVIDIA/SkillSpector/releases/download/v2.13.7/skillspector-2.13.7-py3-none-any.whl \
            --output /tmp/skillspector-2.13.7-py3-none-any.whl
          echo "e2356aa11f0d484f789543f25da6208fe2408641c8b16e7b59bc6600c5c39ffb  /tmp/skillspector-2.13.7-py3-none-any.whl" | sha256sum --check -
      - name: Install pinned SkillSpector
        run: python -m pip install /tmp/skillspector-2.13.7-py3-none-any.whl
      - name: Run static scan against benign fixture
        env:
          PYTHONPATH: .
        run: |
          python security/skillspector/scan.py \
            --target security/skillspector/fixtures/benign-skill \
            --revision "$GITHUB_SHA" \
            --scanner-version 2.13.7 \
            --output-dir /tmp/skillspector-report
      - name: Fetch pinned LEMO Opuscar source for static review
        run: |
          git clone --no-checkout https://github.com/lemomo-ai/lemo-opuscar.git /tmp/lemo-opuscar
          git -C /tmp/lemo-opuscar checkout --detach 2ef41cca9a9330c96c00ec0d8d40807b4b062bb4
      - name: Scan LEMO Opuscar skill without LLM and assert blocking evidence
        env:
          PYTHONPATH: .
        run: |
          set +e
          python security/skillspector/scan.py \
            --target /tmp/lemo-opuscar/plugin/skills/lemo-opuscar \
            --revision 2ef41cca9a9330c96c00ec0d8d40807b4b062bb4 \
            --scanner-version 2.13.7 \
            --output-dir /tmp/lemo-skillspector-report
          scan_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/lemo-skillspector-report/scan-manifest.json").read_text())
          assert manifest["scanner_exit_code"] == 0, manifest
          assert manifest["decision"] == "block", manifest
          assert manifest["report_sha256"], manifest
          assert any("HIGH" in reason for reason in manifest["reasons"]), manifest
          PY
          test "$scan_status" -eq 1
      - name: Preserve scanner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-upstream-reports
          path: |
            /tmp/skillspector-report/
            /tmp/lemo-skillspector-report/
          if-no-files-found: warn
          retention-days: 14


  scan-agent-reach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify pinned SkillSpector wheel
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/NVIDIA/SkillSpector/releases/download/v2.13.7/skillspector-2.13.7-py3-none-any.whl \
            --output /tmp/skillspector-2.13.7-py3-none-any.whl
          echo "e2356aa11f0d484f789543f25da6208fe2408641c8b16e7b59bc6600c5c39ffb  /tmp/skillspector-2.13.7-py3-none-any.whl" | sha256sum --check -
      - name: Install pinned SkillSpector
        run: python -m pip install /tmp/skillspector-2.13.7-py3-none-any.whl
      - name: Scan pinned Agent Reach skill at immutable release commit
        env:
          PYTHONPATH: .
        run: |
          python security/skillspector/scan_remote.py \
            --repository Panniantong/Agent-Reach \
            --revision 7a38047acf26a729cbb27851e3cb81639da86b29 \
            --subdirectory agent_reach/skill \
            --output-dir /tmp/skillspector-agent-reach-report
      - name: Preserve Agent Reach candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-agent-reach-report
          path: /tmp/skillspector-agent-reach-report/
          if-no-files-found: warn
          retention-days: 30

  scan-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify pinned SkillSpector wheel
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/NVIDIA/SkillSpector/releases/download/v2.13.7/skillspector-2.13.7-py3-none-any.whl \
            --output /tmp/skillspector-2.13.7-py3-none-any.whl
          echo "e2356aa11f0d484f789543f25da6208fe2408641c8b16e7b59bc6600c5c39ffb  /tmp/skillspector-2.13.7-py3-none-any.whl" | sha256sum --check -
      - name: Install pinned SkillSpector
        run: python -m pip install /tmp/skillspector-2.13.7-py3-none-any.whl
      - name: Scan immutable public GitHub candidate without executing it
        env:
          PYTHONPATH: .
          CANDIDATE_REPOSITORY: ${{ github.event.inputs.target_repository }}
          CANDIDATE_REVISION: ${{ github.event.inputs.target_revision }}
          CANDIDATE_SUBDIRECTORY: ${{ github.event.inputs.target_subdirectory }}
        run: |
          python security/skillspector/scan_remote.py \
            --repository "$CANDIDATE_REPOSITORY" \
            --revision "$CANDIDATE_REVISION" \
            --subdirectory "$CANDIDATE_SUBDIRECTORY" \
            --output-dir /tmp/skillspector-candidate-report
      - name: Preserve candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-candidate-report
          path: /tmp/skillspector-candidate-report/
          if-no-files-found: warn
          retention-days: 30
