name: XAUUSD causal event study
on:
  push:
    branches: [agent-reach-setup]
    paths: [research/**, tests/**, .github/workflows/xauusd-event-study.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pandas numpy pytest
      - run: PYTHONPATH=. pytest -q tests/test_event_study.py
      - run: python research/event_study.py --data /tmp/xauusd_m5.csv --out results
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-causal-event-study
          path: results/
