name: XAUUSD long-history event study
on:
  push:
    branches: [agent-reach-setup]
    paths: [research/**, tests/**, .github/workflows/xauusd-event-study.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download 2004-2025 XAUUSD M5 JSONL dataset
        run: |
          curl -L --fail --retry 3 --retry-all-errors \
            "https://huggingface.co/datasets/ZombitX64/xauusd-gold-price-historical-data-2004-2025/resolve/main/XAU_5m_data.jsonl?download=true" \
            -o /tmp/xauusd_m5.jsonl
          echo "650006f860f6d40e120efbbfd152ed3f32ecf6531d1e802cd41c83dc116eba20  /tmp/xauusd_m5.jsonl" | sha256sum -c -
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest
      - name: Run regression tests
        run: PYTHONPATH=. pytest -q tests/test_event_study.py
      - name: Run fixed-parameter event study
        run: python research/event_study.py --data /tmp/xauusd_m5.jsonl --out results
      - name: Upload full-period and holdout results
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-2004-2025-event-study
          path: results/
          retention-days: 14
